AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Service Nest API — Go Lambda behind API Gateway

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret (maps to JWT_SECRET in Lambda)
    MinLength: 16
    MaxLength: 512
  SmtpAppPassword:
    Type: String
    NoEcho: true
    Description: Gmail app password for OTP email (maps to SMTP_APP_PASSWORD)
    MaxLength: 512
  SmtpFrom:
    Type: String
    Description: Sender email address for OTP notifications
    MaxLength: 320
  DynamoDBTableName:
    Type: String
    Default: servicenest
    Description: Existing DynamoDB table name
  S3BucketName:
    Type: String
    Default: service-nest-category1
    Description: Existing S3 bucket for category images
  SNSTopicArn:
    Type: String
    Default: arn:aws:sns:us-east-1:116777895904:Service-Nest
    Description: SNS topic ARN for error notifications
  SMTPHost:
    Type: String
    Default: smtp.gmail.com
  SMTPPort:
    Type: String
    Default: "587"

Globals:
  Function:
    Timeout: 30
    MemorySize: 256

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: service-nest
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          APP_ENV: prod
          DYNAMODB_TABLE: !Ref DynamoDBTableName
          S3_BUCKET: !Ref S3BucketName
          SNS_TOPIC_ARN: !Ref SNSTopicArn
          JWT_SECRET: !Ref JwtSecret
          SECRET: !Ref JwtSecret
          SMTP_APP_PASSWORD: !Ref SmtpAppPassword
          APP_PASSWORD: !Ref SmtpAppPassword
          SMTP_FROM: !Ref SmtpFrom
          SMTP_HOST: !Ref SMTPHost
          SMTP_PORT: !Ref SMTPPort
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTableName
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref SNSTopicArn

Outputs:
  ServiceNestApiUrl:
    Description: API Gateway base URL (Prod stage)
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  HelloWorldFunction:
    Description: Lambda function ARN
    Value: !GetAtt HelloWorldFunction.Arn
  HelloWorldFunctionIamRole:
    Description: Lambda execution role ARN
    Value: !GetAtt HelloWorldFunctionRole.Arn
