name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy (branch, tag, or commit SHA) — use for rollback
        required: true
        default: main
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: service-nest/go.sum

      - name: Run unit tests
        working-directory: service-nest
        run: go test ./...

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM template
        run: sam validate

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      STACK_NAME: serviceNest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.sha }}

      - name: Record deploy metadata
        run: |
          echo "Deploy trigger: ${{ github.event_name }}"
          echo "Git ref input: ${{ inputs.git_ref || 'n/a' }}"
          echo "Deployed SHA: $(git rev-parse HEAD)"
          echo "Deployed subject: $(git log -1 --oneline)"
          echo "Last known-good candidate SHA: $(git rev-parse HEAD)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify OIDC identity
        run: aws sts get-caller-identity --no-cli-pager

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build and deploy
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          CONFIRM_CHANGESET: "false"
        run: bash scripts/deploy.sh --no-confirm

      - name: Smoke bundle
        run: bash scripts/verify-deploy.sh
